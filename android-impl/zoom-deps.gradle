// Transitive dependencies of the Zoom Meeting SDK (mobilertc.aar).
//
// Applied by BOTH android-impl/build.gradle and the app's base module.
//
// Zoom lives in an on-demand feature module, but these libraries are shared with
// the base app (Compose, Lifecycle, Activity, ...). If only the feature declared
// them, the base would resolve older versions on its own -- Lifecycle 2.8.7 in
// the base against 2.9.4 in the feature, Compose 1.6.8 against 1.9.4 -- and the
// bundle fails with "Modules 'base' and 'zoom' contain entry ... with different
// content". Excluding those META-INF entries would only hide the skew: the base's
// older classes load first, and Zoom calling a newer API crashes at runtime.
//
// Declaring them in the base keeps one copy at the version Zoom was built
// against. It also restores what the base already shipped before Zoom moved out:
// with Zoom in the base, Gradle resolved this whole graph together.
//
// The JitPack artifact's POM has no dependencies, so nothing but this file
// forces a version: the list is mirrored from the SDK's mobilertc/build.gradle +
// versions.gradle. Keep it in sync on upgrade -- pinning below what mobilertc
// was compiled against surfaces as NoSuchMethodError at runtime, and there is no
// other declaration to catch it.
//
// Mirrored from 7.2.1.43944. Where this file already asked for something newer
// than the SDK does -- recyclerview, material3, viewbinding -- the higher one
// stays, because Gradle would resolve to it anyway and the app needs it.
// flexbox and eventbus were dropped: 7.2.1 no longer pulls them in.
//
// Re-check with scripts/, or by hand:
//   diff <(grep -oE "[a-z.]+:[a-z-]+:[0-9][^']*" zoom-deps.gradle | sort) ...
//     against mobilertc-android-studio/mobilertc/versions.gradle

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.10.01')

    implementation 'androidx.security:security-crypto:1.1.0-alpha05'
    implementation 'com.google.crypto.tink:tink-android:1.7.0'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.17.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.17.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.github.bumptech.glide:annotations:4.11.0'
    implementation 'com.github.bumptech.glide:glide:4.11.0'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.airbnb.android:lottie:4.0.0'

    implementation 'androidx.window:window:1.1.0'
    implementation 'androidx.window:window-java:1.1.0'

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0-alpha03'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0-alpha03'
    implementation 'androidx.lifecycle:lifecycle-service:2.11.0-alpha03'
    implementation 'androidx.work:work-runtime:2.9.0'

    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view:3.10.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0-alpha03'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'

    implementation 'androidx.compose.material3:material3:1.5.0-alpha07'
    implementation 'androidx.compose.material3:material3-window-size-class:1.5.0-alpha07'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout-compose:1.1.1'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0-alpha03'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0-alpha03'
    implementation 'androidx.navigation:navigation-compose:2.9.4'
    // Navigation 3, which nothing else in the graph pulls in. Without it the
    // in-meeting chat crashes the moment it opens:
    //   java.lang.NoClassDefFoundError: androidx/navigation3/runtime/NavKey
    //     at us.zoom.zmsg.fragment.MMChatInputFragment.onCreateView
    // Found by tapping Chat in a real meeting, not by reading -- the empty
    // JitPack POM means a missing dependency only ever shows up at runtime, on
    // the one screen that touches it. Versions are Zoom's own, from
    // mobilertc-android-studio/mobilertc/versions.gradle in 7.2.1.43944.
    implementation 'androidx.navigation3:navigation3-runtime:1.1.3'
    implementation 'androidx.navigation3:navigation3-ui:1.1.3'
    implementation 'androidx.navigationevent:navigationevent:1.0.2'
    implementation 'androidx.navigationevent:navigationevent-compose:1.0.2'

    // Two more the empty POM hides, found the same way but before they crashed:
    // extracting mobilertc's classes.jar and grepping the constant pools shows 3
    // classes referencing androidx.paging.compose and 5 referencing
    // androidx.credentials. Nothing else Zoom declares and the graph lacks is
    // referenced at all -- protobuf, nimbus-jose-jwt, atomicfu, compose.material
    // and the ui-test artifacts all come back with zero references, so they stay
    // out. com.symbol:emdk has one reference but is Zebra-only and compileOnly
    // for Zoom, and is not on a public repository.
    implementation 'androidx.paging:paging-compose:3.3.5'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'io.coil-kt:coil-gif:2.7.0'

    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'org.jetbrains:annotations:23.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-swing:1.9.0'

    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'

    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.blueparrott:blueparrottsdk:4.8.2'

    implementation 'androidx.databinding:viewbinding:8.10.0'
}
