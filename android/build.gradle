apply plugin: 'com.android.library'

// Zoom Meeting SDK for Android
//   SDK version : 7.1.6.41900
//   Artifact    : https://jitpack.io/#vuduc4793/jitpack-zoom-us
//
// NOTE: the JitPack artifact is published from a bare .aar via
// `mvn install:install-file -DgeneratePom=true`, so its POM carries no
// dependencies. Every transitive dependency mobilertc.aar needs must therefore
// be declared explicitly below. The list is mirrored from
//   zoom-sdk-android-7.1.6.41900/mobilertc-android-studio/mobilertc/build.gradle
// resolved against that SDK's versions.gradle. Keep the two in sync on upgrade:
// mobilertc is compiled against these exact versions and mismatches surface as
// NoSuchMethodError at runtime, not at build time.
def ZOOM_SDK_VERSION = '7.1.6.41900'

android {
    namespace 'ch.milosz.reactnative'

    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        // Zoom Meeting SDK 7.1.x declares minSdkVersion 28 in mobilertc.aar.
        // Anything lower fails manifest merging in the consuming app.
        minSdkVersion 28
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        vectorDrawables.useSupportLibrary = true
        consumerProguardFiles 'proguard.cfg'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation 'com.facebook.react:react-native:+' // From node_modules

    implementation "com.github.vuduc4793:jitpack-zoom-us:${ZOOM_SDK_VERSION}"

    // ---- mobilertc.aar transitive dependencies (mirrored from the SDK) ----
    implementation platform('androidx.compose:compose-bom:2025.10.01')

    implementation 'androidx.security:security-crypto:1.1.0-alpha05'
    implementation 'com.google.crypto.tink:tink-android:1.7.0'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.17.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.17.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.github.bumptech.glide:annotations:4.11.0'
    implementation 'com.github.bumptech.glide:glide:4.11.0'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.airbnb.android:lottie:4.0.0'

    implementation 'androidx.window:window:1.1.0'
    implementation 'androidx.window:window-java:1.1.0'

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
    implementation 'androidx.core:core:1.13.0'
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-service:2.9.1'
    implementation 'androidx.work:work-runtime:2.9.0'

    implementation 'androidx.fragment:fragment-ktx:1.4.1'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view:3.10.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.1'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'

    implementation 'androidx.compose.material3:material3:1.5.0-alpha07'
    implementation 'androidx.compose.material3:material3-window-size-class:1.5.0-alpha07'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.9.4'
    implementation 'androidx.constraintlayout:constraintlayout-compose:1.1.1'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.navigation:navigation-compose:2.9.2'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.0'
    implementation 'io.coil-kt:coil-compose:2.3.0'
    implementation 'io.coil-kt:coil-gif:2.7.0'

    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'org.jetbrains:annotations:23.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-swing:1.9.0'

    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'

    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.blueparrott:blueparrottsdk:4.8.2'

    implementation 'org.greenrobot:eventbus:3.1.1'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'androidx.databinding:viewbinding:8.10.0'
}
