apply plugin: 'com.android.library'

// Loader half of the library: this is what autolinking puts in the base APK.
//
// It must not depend on the Zoom SDK. The SDK lives in android-impl/, which is
// consumed by the app's on-demand feature module -- see docs/DYNAMIC-FEATURE.md.
// Keeping the two apart is what allows the base app to compile without
// us.zoom.sdk.* on its classpath.

android {
    namespace 'ch.milosz.reactnative.loader'

    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        // Deliberately lower than the 28 the Zoom SDK needs: the base app should
        // still install on older devices, it just cannot join meetings there.
        minSdkVersion 24
        targetSdkVersion 36
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation 'com.facebook.react:react-native:+' // From node_modules
    implementation 'com.google.android.play:feature-delivery:2.1.0'
}
